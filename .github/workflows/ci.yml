name: ci

on:
  push:
    branches: ['**']
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  gitleaks:
    name: scan for credentials
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  check:
    name: lint · typecheck · unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint typecheck test build

  integration:
    name: integration (RLS + tenant isolation)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: aviora
          POSTGRES_USER: aviora_owner
          POSTGRES_PASSWORD: ci-owner-pw
        ports:
          - 5439:5432
        options: >-
          --health-cmd "pg_isready -U aviora_owner -d aviora"
          --health-interval 5s --health-timeout 3s --health-retries 10
      # The shared rate-limit budget (docs/38 §2) is the one thing here that
      # cannot be tested without real infrastructure: the claim is that two
      # processes spend ONE allowance, and a mock cannot demonstrate sharing.
      # Its spec skips when AVIORA_REDIS_URL is unset, so without this service
      # the test would pass by never running.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      AVIORA_DATABASE_URL: postgresql://aviora_owner:ci-owner-pw@localhost:5439/aviora
      AVIORA_APP_DATABASE_URL: postgresql://aviora_app:ci-app-pw@localhost:5439/aviora
      AVIORA_PLATFORM_DATABASE_URL: postgresql://aviora_platform:ci-platform-pw@localhost:5439/aviora
      AVIORA_JWT_ACCESS_SECRET: ci-only-access-secret-not-a-real-credential-x1
      AVIORA_JWT_REFRESH_SECRET: ci-only-refresh-secret-not-a-real-credential-1
      AVIORA_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @aviora/shared build
      - run: pnpm --filter @aviora/db build
      - name: blind-index key for this run
        # Generated, not committed. CI must run the state production runs in —
        # without a key the CRM falls back to comparing plaintext and matches a
        # phone only if it was typed the same way twice, so the suite passes for
        # the wrong reason (it did exactly that once, docs/55 §2.1). A fresh
        # random key is enough because nothing computed with it outlives the run,
        # and a literal here would be committed key material even as a fake.
        run: echo "AVIORA_BLIND_INDEX_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - name: migrate
        run: pnpm --filter @aviora/db exec prisma migrate deploy
      - name: app role
        run: pnpm --filter @aviora/db exec tsx prisma/setup-app-role.ts
      - name: tenant isolation suite
        run: pnpm --filter @aviora/api test:integration

  browser:
    name: browser E2E (mobile viewport)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: aviora
          POSTGRES_USER: aviora_owner
          POSTGRES_PASSWORD: ci-owner-pw
        ports:
          - 5439:5432
        options: >-
          --health-cmd "pg_isready -U aviora_owner -d aviora"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      AVIORA_DATABASE_URL: postgresql://aviora_owner:ci-owner-pw@localhost:5439/aviora
      AVIORA_APP_DATABASE_URL: postgresql://aviora_app:ci-app-pw@localhost:5439/aviora
      AVIORA_PLATFORM_DATABASE_URL: postgresql://aviora_platform:ci-platform-pw@localhost:5439/aviora
      AVIORA_JWT_ACCESS_SECRET: ci-only-access-secret-not-a-real-credential-x1
      AVIORA_JWT_REFRESH_SECRET: ci-only-refresh-secret-not-a-real-credential-1
      AVIORA_SEED_PLATFORM_ADMIN_EMAIL: admin@aviora.local
      AVIORA_SEED_PLATFORM_ADMIN_PASSWORD: ci-only-admin-password-not-real-1
      NEXT_PUBLIC_API_URL: http://localhost:3021/api/v1
      AVIORA_API_PORT: '3021'
      AVIORA_WEB_PORT: '3020'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @aviora/shared build
      - run: pnpm --filter @aviora/db build
      - name: blind-index key for this run
        # Generated, not committed. CI must run the state production runs in —
        # without a key the CRM falls back to comparing plaintext and matches a
        # phone only if it was typed the same way twice, so the suite passes for
        # the wrong reason (it did exactly that once, docs/55 §2.1). A fresh
        # random key is enough because nothing computed with it outlives the run,
        # and a literal here would be committed key material even as a fake.
        run: echo "AVIORA_BLIND_INDEX_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - name: migrate + app role + seed
        run: |
          pnpm --filter @aviora/db exec prisma migrate deploy
          pnpm --filter @aviora/db exec tsx prisma/setup-app-role.ts
          pnpm --filter @aviora/db exec tsx prisma/seed.ts
      - name: build and start the API
        run: |
          pnpm --filter @aviora/api build
          node apps/api/dist/main.js &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3021/healthz && break || sleep 1
          done
      - run: pnpm --filter @aviora/web exec playwright install --with-deps chromium
      - run: pnpm --filter @aviora/web e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
